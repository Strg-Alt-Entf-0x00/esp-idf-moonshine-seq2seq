## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version (validated with ESP-IDF 6.0.2)
  idf:
    version: '>=6.0.2'
  espressif/esp_codec_dev:
    version: "^1.6.2"
    rules:
      - if: "idf_version >=6.0"
  espressif/esp_wifi_remote:
    matches:
      - if: "idf_version >=6.0"
        version: ">=1.6,<2.0"
      - if: "idf_version <6.0"
        version: "0.14.*"
  espressif/esp_hosted:
    matches:
      - if: "idf_version >=6.0"
        version: ">=3.1,<4.0"
      - if: "idf_version <6.0"
        version: "1.4.*"
  esp-idf-pulsevad:
    git: https://github.com/Strg-Alt-Entf-0x00/esp-idf-pulsevad.git
  esp-idf-moonshine-seq2seq:
    override_path: ../../..
  esp-idf-model-manager:
    git: https://github.com/Strg-Alt-Entf-0x00/esp-idf-model-manager.git


